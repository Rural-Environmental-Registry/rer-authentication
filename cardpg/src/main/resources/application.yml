spring:
  application:
    name: cardpg

server:
  port: 8081
  address: 0.0.0.0
  servlet:
    contextPath: ${SERVER_CONTEXT_PATH:/}

keycloak:
  url: ${KEYCLOAK_URL:http://authentication:8080/keycloak}
  realm: car-dpg
  client-id: api-service
  client-secret: ${KEYCLOAK_CLIENT_SECRET}
  redirect-uri: http://localhost:5173/rectest

backend:
  base-url: ${BACKEND_BASE_URL:http://core-backend:8080/cardpgbackend}

management:
  endpoints:
    web:
      exposure:
        include: health
